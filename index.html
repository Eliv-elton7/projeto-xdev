<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>
    <style>
        th, td {
            border: 1px solid black
        }

        tfoot {
            background-color: cyan;
        }
    </style>
</head>
<body>
    <Table>
        <thead>
            <tr>
                <tr>
                    <th>Produto</th>
                    <th>Quantidade</th>
                    <th>Preço</th>
                    <th>Black friday</th>
                </tr>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Tenis nik</td>
                <td>1 Peça</td>
                <td>289,99 R$</td>
                <td rowspan="2">Sim</td>
            </tr>
            
            <tr>
                <td>Camiseta</td>
                <td>3 Peças</td>
                <td>62,70 R$</td>
            </tr>
            
            <tr>
                <td>Bermuda</td>
                <td>3 Peças</td>
                <td>89,70 R$</td>
                <td>Náo</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <tr>
                    <td colspan="3">Total</td>
                    <td>442,39 R$</td>
                </tr>
            </tr>
        </tfoot>
    </Table>
</body>
</html>
